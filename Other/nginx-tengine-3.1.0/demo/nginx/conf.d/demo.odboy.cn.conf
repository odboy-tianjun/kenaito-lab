# demo.odboy.cn -> http
server {
    listen  80;
    server_name  demo.odboy.cn;

    access_log  /dev/stdout  main;

    location / {
        root   /usr/local/nginx/html;
        index  index.html index.htm;
    }

    # 反向代理到 HTTP 服务（同一 docker 网络中直接用服务名:端口，例如下面 nacos 的写法）
    #location /api/ {
    #    proxy_pass  http://172.25.0.21:8848/;
    #    proxy_set_header  Host  $host;
    #    proxy_set_header  X-Real-IP  $remote_addr;
    #    proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
    #    proxy_set_header  X-Forwarded-Proto  $scheme;
    #}
}

# demo.odboy.cn -> https
server {
    listen  443  ssl;
    http2  on;
    server_name  demo.odboy.cn;

    access_log  /dev/stdout  main;

    # 证书放在 ./nginx/ssl 下，挂载到 /usr/local/nginx/conf/ssl
    ssl_certificate  /usr/local/nginx/conf/ssl/demo.odboy.cn.pem;
    ssl_certificate_key  /usr/local/nginx/conf/ssl/demo.odboy.cn.key;

    ssl_session_cache  shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers  on;

    location / {
        root   /usr/local/nginx/html;
        index  index.html index.htm;
    }
}

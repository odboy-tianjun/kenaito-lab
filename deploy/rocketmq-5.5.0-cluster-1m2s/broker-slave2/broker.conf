# ===================== RocketMQ 5.5.0 新特性（显式写出默认值，便于检索与调参） =====================

# ---- Lite Mode（RIP-83，5.5.0 唯一新增特性）：面向 AI 场景的轻量级订阅模型 ----
# 开关 Lite 事件分发，Lite Topic 的生命周期管理、订阅注册、指标上报都依赖它，默认 true
enableLiteEventMode=true
# Lite 事件分发扫描周期，单位毫秒；越小越实时，越大越省 CPU，默认 10000
liteEventCheckInterval=10000
# Lite Topic 过期检查周期，单位毫秒，默认 120000
liteTtlCheckInterval=120000
# Lite Topic 最短存活时间，单位毫秒，默认 900000（15 分钟），存活不足该时长的 Topic 不会被清理
minLiteTTl=900000
# Lite 订阅有效性检查周期，单位毫秒，默认 120000
liteSubscriptionCheckInterval=120000
# Lite 订阅检查超时时间，单位毫秒，默认 180000
liteSubscriptionCheckTimeoutMills=180000
# 单个 Broker 允许的 Lite 订阅数量上限，默认 100000
maxLiteSubscriptionCount=100000
# 是否打印 Lite POP 消费日志，排查 Lite 问题时临时置 true，默认 false
enableLitePopLog=false
# 单个 Lite 客户端连接允许挂载的最大事件数，默认 100
maxClientEventCount=100
# 全量分发延迟时间，单位毫秒，默认 10000，避免订阅建立瞬间的抖动
liteEventFullDispatchDelayTime=10000
# 通配订阅（wildcard group）的全量分发延迟时间，单位毫秒，默认 10000
liteEventFullDispatchDelayTimeForWildcardGroup=10000
# Lite 消费延迟指标：是否采集 storeTime（有额外开销），默认 false
liteLagLatencyCollectEnable=false
# 是否开启 Lite 消费延迟指标，默认 false
liteLagLatencyMetricsEnable=false
# 是否开启 Lite 堆积条数指标，默认 false
liteLagCountMetricsEnable=false
# Lite 延迟指标只统计 TopK，默认 50
liteLagLatencyTopK=50

# ---- Light Message Queue（LMQ，5.x 轻量消息队列，Lite Mode 的存储底座之一）----
# 是否启用 LMQ，启用后每个队列可承载大量轻量消息，默认 false；需要配合 Lite 使用时再打开
enableLmq=false
# 是否启用 LMQ 配额控制，默认 false
enableLmqQuota=false

# ---- Controller 模式（5.x 主从自动切换）----
# 是否以 Controller 模式启动 Broker（自动选主，替代人工主从切换），默认 false
# 注意：开启后必须同时运行 controller 组件（namesrv 内嵌 controller 或独立 controller 服务），否则 Broker 选不出主节点
enableControllerMode=false
# Controller 地址列表，多个地址用分号分隔；仅在 enableControllerMode=true 时生效
controllerAddr=

# ---- RocksDB 存储增强（5.x 默认存储后端，4.x 无）----
# 事务消息是否使用 RocksDB 存储（半消息/op 消息），默认 false
transRocksDBEnable=false
# 启用 transRocksDBEnable 后，是否仍把原始半消息写入 CommitLog，默认 true
transWriteOriginTransHalfEnable=true

# ---- 其它 5.x 才有的能力 ----
# 是否开启 ConsumeQueue 扩展存储（存放消息 TAG 的哈希等），按需开启，默认 false
enableConsumeQueueExt=false

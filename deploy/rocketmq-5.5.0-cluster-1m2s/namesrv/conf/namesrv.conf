# ===================== RocketMQ 5.5.0 NameServer 配置 =====================
# 说明：4.9.7 的 mqnamesrv 用默认配置即可，没有独立配置文件；5.x 新增了 Lite Mode、LMQ、
# Controller、RocksDB 等能力，其中与 NameServer 相关的新增项在此显式列出（均写成默认值，便于检索与调参）。

# kvConfig 持久化路径，默认 ~/namesrv/kvConfig.json；NameServer 在此保存 KV 配置、
# 命名空间策略（NACOS 风格 namespace）等元数据，容器重建不保留，需要持久化时指向挂载目录
kvConfigPath=/home/rocketmq/namesrv/kvConfig.json

# 运行期配置存储路径（通过 updateNamesrvConfig 修改的配置落在这里），默认 ~/namesrv/namesrv.properties
configStorePath=/home/rocketmq/namesrv/namesrv.properties

# 是否允许通过 updateNamesrvConfig 动态修改 NameServer 配置，被 configBlackList 列出的项除外
# configBlackList 默认值：configBlackList;configStorePath;kvConfigPath
# configBlackList=configBlackList;configStorePath;kvConfigPath

# ---- 5.x Lite Mode 依赖的路由能力（NameServer 侧无独立开关，依赖 Broker 上报）----
# Lite Mode 的 Lite Topic 路由同样由 Broker 注册到 NameServer，NameServer 无需为 Lite 单独开配置；
# 若开启 Controller 模式（Broker 侧 enableControllerMode=true），需在 NameServer 内嵌 controller：
# enableControllerInNamesrv=true
# enableControllerInNamesrv=false

# 是否在 NameServer 中等待 controller 可用后再启动（仅 enableControllerInNamesrv=true 时有意义），默认 false
# needWaitForService=false
# 等待 controller 的最长秒数，默认 45
# waitSecondsForService=45

# ---- 其它 5.x 相关 ----
# 是否开启顺序消息的 System Topic 支持（顺序消息路由相关），默认 false
# orderMessageEnable=false
# 是否把顺序消息 Topic 的路由信息回传给 Broker，默认 true
# returnOrderTopicConfigToBroker=true
# 允许从 Broker 注销时同步删除 NameServer 上不存在的 Topic，默认 false
# 注意：与 Broker 的 enableSingleTopicRegister 同时开启，否则可能误删路由
# deleteTopicWithBrokerRegistration=false
# Broker 掉线扫描周期（毫秒），默认 5000
# scanNotActiveBrokerInterval=5000

version: '3.8'

networks:
  dotnet9-demo:
    ipam:
      driver: default
      config:
        - subnet: "172.29.0.0/24"

services:
  demo:
    image: registry.cn-shanghai.aliyuncs.com/odboy/kenaito:demo-dotnet9   # 镜像由 build.sh 构建
    container_name: dotnet9-demo
    restart: unless-stopped
    ports: # 映射端口
      - "8082:8082"
    environment: # 设置环境变量,相当于docker run命令中的-e
      TZ: Asia/Shanghai
      ASPNETCORE_URLS: http://0.0.0.0:8082
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep -q ':8082 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      dotnet9-demo:
        ipv4_address: 172.29.0.20

version: '3.8'

networks:
  python310-flask-demo:
    ipam:
      driver: default
      config:
        - subnet: "172.30.0.0/24"

services:
  demo:
    image: registry.cn-shanghai.aliyuncs.com/odboy/kenaito:demo-python310-flask   # 镜像由 build.sh 构建
    container_name: python310-flask-demo
    restart: unless-stopped
    ports: # 映射端口
      - "8083:8083"
    environment: # 设置环境变量,相当于docker run命令中的-e
      TZ: Asia/Shanghai
      APP_PORT: "8083"
    healthcheck:
      # 运行镜像自带 net-tools，直接用端口探测，不额外安装 curl
      test: ["CMD-SHELL", "netstat -tln | grep -q ':8083 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      python310-flask-demo:
        ipv4_address: 172.30.0.20

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>spring-war17 运行信息</title>
    <style>
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 40px; color: #222; }
        h1 { font-size: 20px; }
        table { border-collapse: collapse; min-width: 520px; }
        th, td { border: 1px solid #ddd; padding: 6px 12px; text-align: left; }
        th { background: #f5f5f5; width: 160px; }
        code { background: #f5f5f5; padding: 1px 4px; }
    </style>
</head>
<body>
<h1>spring-war17 运行信息</h1>
<table>
    <tr th:each="entry : ${info}">
        <th th:text="${entry.key}">key</th>
        <td th:text="${entry.value}">value</td>
    </tr>
</table>
<p>
    其他接口：<code>api/info</code>、<code>api/hello/{name}</code>
</p>
</body>
</html>

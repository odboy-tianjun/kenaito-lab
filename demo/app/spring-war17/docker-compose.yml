version: '3.8'

networks:
  spring-war17-demo:
    ipam:
      driver: default
      config:
        - subnet: "172.30.2.0/24"

services:
  demo:
    image: registry.cn-shanghai.aliyuncs.com/odboy/kenaito:demo-spring-war17   # 镜像由 build.sh 构建
    container_name: spring-war17-demo
    restart: unless-stopped
    ports: # 映射端口：8085 -> 容器内 Tomcat 8080
      - "8085:8080"
    environment: # 设置环境变量,相当于docker run命令中的-e
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms128m -Xmx256m -Duser.timezone=Asia/Shanghai"
      CATALINA_OPTS: "-Djava.security.egd=file:/dev/./urandom"
    healthcheck:
      # runtime-tomcat10 已装 curl，直接探测健康页面；start_period 覆盖 war 解压与 Spring 初始化
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/spring-war17/api/info > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      spring-war17-demo:
        ipv4_address: 172.30.2.20

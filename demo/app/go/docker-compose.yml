version: '3.8'

networks:
  go-demo:
    ipam:
      driver: default
      config:
        - subnet: "172.31.0.0/24"

services:
  demo:
    image: registry.cn-shanghai.aliyuncs.com/odboy/kenaito:demo-go   # 镜像由 build.sh 构建
    container_name: go-demo
    restart: unless-stopped
    ports: # 映射端口
      - "8086:8086"
    environment: # 设置环境变量,相当于docker run命令中的-e
      TZ: Asia/Shanghai
      APP_PORT: "8086"
    healthcheck:
      # 运行镜像自带 net-tools，直接用端口探测，不额外安装 curl
      test: ["CMD-SHELL", "netstat -tln | grep -q ':8086 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      go-demo:
        ipv4_address: 172.31.0.20

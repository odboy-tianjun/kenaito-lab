version: '3.8'

networks:
  node-backend-demo:
    ipam:
      driver: default
      config:
        - subnet: "172.31.1.0/24"

services:
  demo:
    image: registry.cn-shanghai.aliyuncs.com/odboy/kenaito:demo-node-backend   # 镜像由 build.sh 构建
    container_name: node-backend-demo
    restart: unless-stopped
    ports: # 映射端口
      - "8087:8087"
    environment: # 设置环境变量,相当于docker run命令中的-e
      TZ: Asia/Shanghai
      APP_PORT: "8087"
      NODE_ENV: production
    healthcheck:
      # 运行镜像自带 net-tools，直接用端口探测，不额外安装 curl
      test: ["CMD-SHELL", "netstat -tln | grep -q ':8087 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      node-backend-demo:
        ipv4_address: 172.31.1.20

version: '3.8'

networks:
  springboot-jar17-demo:
    ipam:
      driver: default
      config:
        - subnet: "172.30.1.0/24"

services:
  demo:
    image: registry.cn-shanghai.aliyuncs.com/odboy/kenaito:demo-springboot-jar17   # 镜像由 build.sh 构建
    container_name: springboot-jar17-demo
    restart: unless-stopped
    ports: # 映射端口
      - "8084:8084"
    environment: # 设置环境变量,相当于docker run命令中的-e
      TZ: Asia/Shanghai
      APP_PORT: "8084"
      JAVA_OPTS: "-Xms128m -Xmx256m"
    healthcheck:
      # 运行镜像自带 net-tools，直接用端口探测，不额外安装 curl
      test: ["CMD-SHELL", "netstat -tln | grep -q ':8084 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      springboot-jar17-demo:
        ipv4_address: 172.30.1.20

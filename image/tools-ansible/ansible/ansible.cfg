# Ansible 常用配置（ansible-core 2.16，镜像 kenaito:ansible 内使用）
#
# 优先级：命令行参数 > 环境变量(ANSIBLE_xxx) > 本文件 > Ansible 内置默认值。
# 本文件只保留日常运维真正会调的项，其余默认值足够用；
# 完整选项清单与说明见 ansible.default/ansible.zh.cfg（英文原版为 ansible.default/ansible.cfg）。
#
# 格式说明：ini 风格，[段名] 开头，key=value；行首 # 或 ; 为注释。
# 改了这里记得确认生效位置：ansible --version 输出的 config file 一栏。

[defaults]

# ---------------------------------------------------------------------------
# 基本行为
# ---------------------------------------------------------------------------

# 并发主机数。默认 5 偏保守；批量执行可提高到 20~50，视目标网络与 CPU 而定
forks = 20

# 默认清单。镜像里 hosts 与本文件同目录；也可以用 -i 指定，或改用 group_vars/host_vars
#inventory = /etc/ansible/hosts

# 默认策略：linear 按任务逐批推进；free 让每台主机尽快跑完自己的任务
strategy = linear

# 只收集常用事实（网络、硬件、虚拟化等），可明显加快执行；
# 需要完整事实时在 playbook 里单独写 gather_facts，或把 gather_subset 改回 all
# 注意：gather_subset 在 ansible-core 2.18 起被移除，2.16 运行时会报 DEPRECATION WARNING；
# 因镜像锁定 2.16.3 而保留，告警已在下方 deprecation_warnings 统一关闭
gather_subset = !min,network,hardware,virtual
# 事实收集策略：implicit 每次隐式收集；smart 有缓存时优先用缓存；explicit 不自动收集
gathering = smart
# 配合 gathering=smart 使用内存缓存（进程级，跨次运行不持久；要持久可换 jsonfile/redis）
fact_caching = memory

# 被控节点执行模块用的 Python 解释器。auto 会自动探测常见路径（系统自带 3.8+ 优先）；
# 目标机是编译版 Python 等非标准路径时，改成绝对路径；auto_silent 与 auto 相同但不打告警
interpreter_python = auto_silent

# 失败时生成 .retry 文件，方便 ansible-playbook site.yml --limit @site.retry 只重跑失败主机
retry_files_enabled = True
retry_files_save_path = ~/.ansible/retry

# 日志。默认不落盘；排查问题时打开，注意日志同样包含敏感信息
#log_path = /var/log/ansible/ansible.log

# 输出与交互
# 注意：Ansible 的配置文件不识别行尾注释，# 只能写在行首独占一行，否则注释会被当成值的一部分
# 想要更紧凑的 stdout，把 stdout_callback 换成 yaml
stdout_callback = default
# 隐藏 skipped 任务，输出更干净
display_skipped_hosts = False
# 关闭弃用告警：gather_subset 在 2.16 已被标记弃用，每次运行都会刷一条告警
# 代价是其它弃用信息也一并静默，排查时可临时改回 True
deprecation_warnings = False
# 清单为空时的告警，容器里跑 adhoc 命令常遇到
localhost_warning = False
# True 时任一主机失败即终止整个 play
any_errors_fatal = False

# 超时与性能
# 连接插件默认超时（秒），慢网络可调大
timeout = 30
# 开启 pipelining 减少 SSH 往返、显著提速；
# 注意：become 场景下要求被控机 sudoers 不能有 requiretty，否则会报错
pipelining = True

# 主机密钥校验。内网首次连接可关掉，避免卡在 fingerprint 确认；
# 公网环境建议保持默认 True 并预先分发 known_hosts
host_key_checking = False

[privilege_escalation]

# 提权（become）全局默认值。通常按需在命令行用 -b / -K 或在 playbook 里设置；
# 这里给出常见的内网 sudo 配置
become = False
become_method = sudo
become_user = root
#become_ask_pass = False

[ssh_connection]

# SSH 连接层配置
# 连接复用：同一主机的多次任务只建一次 SSH 连接，批量执行时提速明显
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
# 连接复用套接字目录；路径带主机/端口/用户哈希，避免多用户互相覆盖
control_path_dir = /tmp/.ansible-cp
control_path = %(directory)s/%%h-%%p-%%r

[colors]
# 终端颜色，按习惯调整即可
ok = green
changed = yellow
skip = cyan
unreachable = bright red
verbose = blue
warn = bright purple
